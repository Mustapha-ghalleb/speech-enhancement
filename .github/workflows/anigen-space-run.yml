name: AniGen Space Run

on:
  push:
    paths:
      - '.github/workflows/anigen-space-run.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Inspect AniGen Space API
        run: |
          set -euxo pipefail
          python -m pip install --quiet --upgrade gradio_client
          python - <<'PY'
          from gradio_client import Client
          c = Client('VAST-AI/AniGen')
          print(c.view_api(all_endpoints=True, print_info=True))
          PY
