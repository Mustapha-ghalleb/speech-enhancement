name: AniGen Space Run

on:
  push:
    paths:
      - '.github/workflows/anigen-space-run.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-anigen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Prepare client and sample image
        run: |
          set -euxo pipefail
          python -m pip install --quiet --upgrade gradio_client
          curl -L --fail --retry 5 -o trex.png https://raw.githubusercontent.com/VAST-AI-Research/AniGen/main/assets/cond_images/trex.png
          file trex.png
          ls -lh trex.png

      - name: Run AniGen on hosted ZeroGPU
        run: |
          set -euxo pipefail
          mkdir -p anigen-output
          python - <<'PY'
          import os, shutil, json
          from pathlib import Path
          from gradio_client import Client, handle_file

          out = Path('anigen-output')
          client = Client('VAST-AI/AniGen')
          print('Starting session...', flush=True)
          client.predict(api_name='/start_session')
          print('Preparing image...', flush=True)
          processed = client.predict(handle_file('trex.png'), api_name='/prepare_input_for_generation')
          print('PREPARED:', repr(processed), flush=True)
          if isinstance(processed, str) and os.path.isfile(processed):
              shutil.copy2(processed, out / 'processed_image.png')

          print('Generating preview...', flush=True)
          preview = client.predict(
              42,
              'ss_flow_solo',
              'slat_flow_auto',
              7.5,
              25,
              3.0,
              25,
              1.0,
              api_name='/generate_preview',
          )
          print('PREVIEW:', repr(preview), flush=True)
          if isinstance(preview, (tuple, list)):
              for i, item in enumerate(preview):
                  if isinstance(item, str) and os.path.isfile(item):
                      suffix = Path(item).suffix or '.bin'
                      shutil.copy2(item, out / f'preview_{i}{suffix}')

          print('Extracting GLB...', flush=True)
          extracted = client.predict(1024, 0.95, True, api_name='/extract_glb')
          print('EXTRACTED:', repr(extracted), flush=True)
          if isinstance(extracted, (tuple, list)):
              names = ['mesh', 'skeleton', 'status']
              for i, item in enumerate(extracted):
                  if isinstance(item, str) and os.path.isfile(item):
                      suffix = Path(item).suffix or '.bin'
                      name = names[i] if i < len(names) else f'output_{i}'
                      shutil.copy2(item, out / f'{name}{suffix}')

          print('OUTPUTS:')
          for p in sorted(out.iterdir()):
              print(p, p.stat().st_size)
          PY

      - name: Publish generated files as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="anigen-trex-${GITHUB_RUN_ID}"
          gh release create "$TAG" anigen-output/* --repo "$GITHUB_REPOSITORY" --title "AniGen T-Rex output ${GITHUB_RUN_ID}" --notes "Generated by the official VAST-AI/AniGen Hugging Face ZeroGPU Space using ss_flow_solo + slat_flow_auto, seed 42."
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
