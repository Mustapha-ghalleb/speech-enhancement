name: AniGen macOS MPS Probe

on:
  push:
    paths:
      - '.github/workflows/anigen-macos-probe.yml'

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Probe Apple Silicon and Metal
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          sw_vers
          sysctl -n hw.memsize
          system_profiler SPHardwareDataType
          system_profiler SPDisplaysDataType || true
          xcrun -sdk macosx metal --version || true
          python3 -m pip install --quiet --user torch
          python3 - <<'PY'
          import torch
          print('torch', torch.__version__)
          print('MPS built', torch.backends.mps.is_built())
          print('MPS available', torch.backends.mps.is_available())
          if torch.backends.mps.is_available():
              x=torch.ones((1024,1024), device='mps')
              y=x@x
              print('MPS matmul', y[0,0].item())
          PY
