name: AniGen macOS MPS Probe

on:
  push:
    paths:
      - '.github/workflows/anigen-macos-probe.yml'

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Probe MPS in virtualenv
        run: |
          set -euxo pipefail
          uname -m
          sysctl -n hw.memsize
          system_profiler SPDisplaysDataType || true
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch
          python - <<'PY'
          import torch
          print('torch', torch.__version__)
          print('MPS built', torch.backends.mps.is_built())
          print('MPS available', torch.backends.mps.is_available())
          if torch.backends.mps.is_available():
              x=torch.ones((1024,1024), device='mps')
              y=x@x
              print('MPS matmul', y[0,0].item())
          PY
