name: AniGen small Actions artifacts

on:
  push:
    paths:
      - .github/workflows/anigen-small-artifacts.yml

permissions:
  contents: read

jobs:
  split-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: anigen-transfer-20260811
    steps:
      - name: Download temporary release assets
        run: |
          mkdir -p transfer
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir transfer
          ls -lh transfer

      - name: Split DINOv2
        run: |
          split -b 450M -d -a 2 transfer/ckpts-dinov2.tar transfer/dinov2.chunk-
          rm -f transfer/ckpts-dinov2.tar
      - uses: actions/upload-artifact@v4
        with: {name: anigen-dinov2-00, path: transfer/dinov2.chunk-00, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-dinov2-01, path: transfer/dinov2.chunk-01, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-dinov2-02, path: transfer/dinov2.chunk-02, compression-level: 0, retention-days: 1}
      - run: rm -f transfer/dinov2.chunk-*

      - name: Split DSINE+VGG
        run: |
          split -b 450M -d -a 2 transfer/ckpts-dsine-vgg.tar transfer/dsine-vgg.chunk-
          rm -f transfer/ckpts-dsine-vgg.tar
      - uses: actions/upload-artifact@v4
        with: {name: anigen-dsine-vgg-00, path: transfer/dsine-vgg.chunk-00, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-dsine-vgg-01, path: transfer/dsine-vgg.chunk-01, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-dsine-vgg-02, path: transfer/dsine-vgg.chunk-02, compression-level: 0, retention-days: 1}
      - run: rm -f transfer/dsine-vgg.chunk-*

      - name: Split SS DAE
        run: |
          split -b 450M -d -a 2 transfer/ckpts-ss-dae.tar transfer/ss-dae.chunk-
          rm -f transfer/ckpts-ss-dae.tar
      - uses: actions/upload-artifact@v4
        with: {name: anigen-ss-dae-00, path: transfer/ss-dae.chunk-00, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-ss-dae-01, path: transfer/ss-dae.chunk-01, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-ss-dae-02, path: transfer/ss-dae.chunk-02, compression-level: 0, retention-days: 1}
      - run: rm -f transfer/ss-dae.chunk-*

      - name: Split SLAT DAE
        run: |
          split -b 450M -d -a 2 transfer/ckpts-slat-dae.tar transfer/slat-dae.chunk-
          rm -f transfer/ckpts-slat-dae.tar
      - uses: actions/upload-artifact@v4
        with: {name: anigen-slat-dae-00, path: transfer/slat-dae.chunk-00, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-slat-dae-01, path: transfer/slat-dae.chunk-01, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-slat-dae-02, path: transfer/slat-dae.chunk-02, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-slat-dae-03, path: transfer/slat-dae.chunk-03, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-slat-dae-04, path: transfer/slat-dae.chunk-04, compression-level: 0, retention-days: 1}
      - run: rm -f transfer/slat-dae.chunk-*

      - name: Split SS Flow Solo part 00
        run: |
          split -b 450M -d -a 2 transfer/ss-flow-solo.tar.part-00 transfer/ss-flow-solo-p00.chunk-
          rm -f transfer/ss-flow-solo.tar.part-00
      - uses: actions/upload-artifact@v4
        with: {name: anigen-ss-flow-solo-p00-00, path: transfer/ss-flow-solo-p00.chunk-00, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-ss-flow-solo-p00-01, path: transfer/ss-flow-solo-p00.chunk-01, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-ss-flow-solo-p00-02, path: transfer/ss-flow-solo-p00.chunk-02, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-ss-flow-solo-p00-03, path: transfer/ss-flow-solo-p00.chunk-03, compression-level: 0, retention-days: 1}
      - run: rm -f transfer/ss-flow-solo-p00.chunk-*

      - name: Split SS Flow Solo part 01
        run: |
          split -b 450M -d -a 2 transfer/ss-flow-solo.tar.part-01 transfer/ss-flow-solo-p01.chunk-
          rm -f transfer/ss-flow-solo.tar.part-01
      - uses: actions/upload-artifact@v4
        with: {name: anigen-ss-flow-solo-p01-00, path: transfer/ss-flow-solo-p01.chunk-00, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-ss-flow-solo-p01-01, path: transfer/ss-flow-solo-p01.chunk-01, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-ss-flow-solo-p01-02, path: transfer/ss-flow-solo-p01.chunk-02, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-ss-flow-solo-p01-03, path: transfer/ss-flow-solo-p01.chunk-03, compression-level: 0, retention-days: 1}
      - run: rm -f transfer/ss-flow-solo-p01.chunk-*

      - name: Split SLAT Flow Auto part 00
        run: |
          split -b 450M -d -a 2 transfer/slat-flow-auto.tar.part-00 transfer/slat-flow-auto-p00.chunk-
          rm -f transfer/slat-flow-auto.tar.part-00
      - uses: actions/upload-artifact@v4
        with: {name: anigen-slat-flow-auto-p00-00, path: transfer/slat-flow-auto-p00.chunk-00, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-slat-flow-auto-p00-01, path: transfer/slat-flow-auto-p00.chunk-01, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-slat-flow-auto-p00-02, path: transfer/slat-flow-auto-p00.chunk-02, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-slat-flow-auto-p00-03, path: transfer/slat-flow-auto-p00.chunk-03, compression-level: 0, retention-days: 1}
      - run: rm -f transfer/slat-flow-auto-p00.chunk-*

      - name: Split SLAT Flow Auto part 01
        run: |
          split -b 450M -d -a 2 transfer/slat-flow-auto.tar.part-01 transfer/slat-flow-auto-p01.chunk-
          rm -f transfer/slat-flow-auto.tar.part-01
      - uses: actions/upload-artifact@v4
        with: {name: anigen-slat-flow-auto-p01-00, path: transfer/slat-flow-auto-p01.chunk-00, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: anigen-slat-flow-auto-p01-01, path: transfer/slat-flow-auto-p01.chunk-01, compression-level: 0, retention-days: 1}
      - run: rm -f transfer/slat-flow-auto-p01.chunk-*
