name: Cleanup AniGen transfer

on:
  push:
    paths:
      - '.github/workflows/cleanup-anigen-transfer.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary AniGen release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete anigen-transfer-20260811 --repo "${{ github.repository }}" --cleanup-tag -y || true
