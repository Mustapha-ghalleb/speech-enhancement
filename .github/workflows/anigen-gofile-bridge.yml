name: AniGen GoFile Bridge

on:
  push:
    paths:
      - '.github/workflows/anigen-gofile-bridge.yml'
  workflow_dispatch:

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check disk
        run: df -h

      - name: Install Hugging Face client
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'huggingface_hub>=0.34' hf_xet

      - name: Download AniGen source and upload
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/VAST-AI-Research/AniGen.git AniGen-src
          rm -rf AniGen-src/.git
          tar -cf anigen-source.tar AniGen-src
          echo '=== GOFILE anigen-source.tar ==='
          curl --fail-with-body --retry 4 --retry-delay 5 -X POST https://upload.gofile.io/uploadfile -F 'file=@anigen-source.tar'
          echo
          rm -rf AniGen-src anigen-source.tar

      - name: Fetch and bridge checkpoint groups
        shell: bash
        run: |
          set -euo pipefail

          fetch_upload() {
            local label="$1"
            shift
            rm -rf hfstage
            mkdir -p hfstage
            python -c "import sys; from huggingface_hub import snapshot_download; p=sys.argv[1:]; print('Downloading patterns:', p, flush=True); snapshot_download(repo_id='VAST-AI/AniGen', repo_type='model', allow_patterns=p, local_dir='hfstage', max_workers=8)" "$@"
            rm -rf hfstage/.cache
            local archive="${label}.tar"
            tar -cf "$archive" -C hfstage .
            echo "=== SIZE $archive ==="
            ls -lh "$archive"
            sha256sum "$archive"
            echo "=== GOFILE $archive ==="
            curl --fail-with-body --retry 4 --retry-delay 10 -X POST https://upload.gofile.io/uploadfile -F "file=@${archive}"
            echo
            rm -rf hfstage "$archive"
            df -h .
          }

          fetch_upload ckpts-dinov2 'ckpts/dinov2/**'
          fetch_upload ckpts-dsine-vgg 'ckpts/dsine/**' 'ckpts/vgg/**'
          fetch_upload ckpts-ss-dae 'ckpts/anigen/ss_dae/**'
          fetch_upload ckpts-slat-dae 'ckpts/anigen/slat_dae/**'
          fetch_upload ckpts-ss-flow-solo 'ckpts/anigen/ss_flow_solo/**'
          fetch_upload ckpts-slat-flow-auto 'ckpts/anigen/slat_flow_auto/**'

      - name: Done
        run: echo 'AniGen bridge completed; GoFile responses are in this job log.'
