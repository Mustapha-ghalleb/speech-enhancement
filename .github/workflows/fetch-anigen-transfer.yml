name: Fetch AniGen transfer bundle

on:
  push:
    paths:
      - .github/workflows/fetch-anigen-transfer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: anigen-transfer-20260811
    steps:
      - name: Checkout transfer repository
        uses: actions/checkout@v4

      - name: Install Hugging Face client
        run: python -m pip install --upgrade huggingface_hub

      - name: Clone AniGen source
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/VAST-AI-Research/AniGen.git AniGen
          rm -rf AniGen/.git

      - name: Download default AniGen inference checkpoints
        shell: bash
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="VAST-AI/AniGen",
              allow_patterns=[
                  "ckpts/dinov2/**",
                  "ckpts/dsine/**",
                  "ckpts/vgg/**",
                  "ckpts/anigen/ss_dae/**",
                  "ckpts/anigen/slat_dae/**",
                  "ckpts/anigen/ss_flow_solo/**",
                  "ckpts/anigen/slat_flow_auto/**",
              ],
              local_dir="AniGen",
          )
          PY
          rm -rf AniGen/.cache
          du -sh AniGen

      - name: Create temporary transfer release
        run: |
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Temporary AniGen transfer" --notes "Temporary public transfer assets for AniGen default inference bundle."

      - name: Publish source bundle
        run: |
          tar --exclude='AniGen/ckpts' -cf anigen-source.tar AniGen
          gh release upload "$RELEASE_TAG" anigen-source.tar --repo "$GITHUB_REPOSITORY"
          rm -f anigen-source.tar

      - name: Publish DINOv2 bundle
        run: |
          tar -cf ckpts-dinov2.tar AniGen/ckpts/dinov2
          gh release upload "$RELEASE_TAG" ckpts-dinov2.tar --repo "$GITHUB_REPOSITORY"
          rm -f ckpts-dinov2.tar
          rm -rf AniGen/ckpts/dinov2

      - name: Publish DSINE and VGG bundle
        run: |
          tar -cf ckpts-dsine-vgg.tar AniGen/ckpts/dsine AniGen/ckpts/vgg
          gh release upload "$RELEASE_TAG" ckpts-dsine-vgg.tar --repo "$GITHUB_REPOSITORY"
          rm -f ckpts-dsine-vgg.tar
          rm -rf AniGen/ckpts/dsine AniGen/ckpts/vgg

      - name: Publish SS DAE bundle
        run: |
          tar -cf ckpts-ss-dae.tar AniGen/ckpts/anigen/ss_dae
          gh release upload "$RELEASE_TAG" ckpts-ss-dae.tar --repo "$GITHUB_REPOSITORY"
          rm -f ckpts-ss-dae.tar
          rm -rf AniGen/ckpts/anigen/ss_dae

      - name: Publish SLAT DAE bundle
        run: |
          tar -cf ckpts-slat-dae.tar AniGen/ckpts/anigen/slat_dae
          gh release upload "$RELEASE_TAG" ckpts-slat-dae.tar --repo "$GITHUB_REPOSITORY"
          rm -f ckpts-slat-dae.tar
          rm -rf AniGen/ckpts/anigen/slat_dae

      - name: Publish SS Flow Solo chunks
        run: |
          tar -cf - AniGen/ckpts/anigen/ss_flow_solo | split -b 1700M -d -a 2 - ss-flow-solo.tar.part-
          gh release upload "$RELEASE_TAG" ss-flow-solo.tar.part-* --repo "$GITHUB_REPOSITORY"
          rm -f ss-flow-solo.tar.part-*
          rm -rf AniGen/ckpts/anigen/ss_flow_solo

      - name: Publish SLAT Flow Auto chunks
        run: |
          tar -cf - AniGen/ckpts/anigen/slat_flow_auto | split -b 1700M -d -a 2 - slat-flow-auto.tar.part-
          gh release upload "$RELEASE_TAG" slat-flow-auto.tar.part-* --repo "$GITHUB_REPOSITORY"
          rm -f slat-flow-auto.tar.part-*
          rm -rf AniGen/ckpts/anigen/slat_flow_auto

      - name: Show release assets
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | [.name, .size] | @tsv'
