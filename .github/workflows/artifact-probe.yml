name: Artifact probe

on:
  push:
    paths:
      - .github/workflows/artifact-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo ok > probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-probe
          path: probe.txt
          retention-days: 1
