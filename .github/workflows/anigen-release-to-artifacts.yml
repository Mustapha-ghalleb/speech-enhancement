name: AniGen release to Actions artifacts

on:
  push:
    paths:
      - .github/workflows/anigen-release-to-artifacts.yml

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: anigen-transfer-20260811
    steps:
      - name: Download temporary release assets
        run: |
          mkdir -p transfer
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir transfer
          ls -lh transfer

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: anigen-source
          path: transfer/anigen-source.tar
          compression-level: 0
          retention-days: 1

      - name: Upload DINOv2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: anigen-dinov2
          path: transfer/ckpts-dinov2.tar
          compression-level: 0
          retention-days: 1

      - name: Upload DSINE+VGG artifact
        uses: actions/upload-artifact@v4
        with:
          name: anigen-dsine-vgg
          path: transfer/ckpts-dsine-vgg.tar
          compression-level: 0
          retention-days: 1

      - name: Upload SS DAE artifact
        uses: actions/upload-artifact@v4
        with:
          name: anigen-ss-dae
          path: transfer/ckpts-ss-dae.tar
          compression-level: 0
          retention-days: 1

      - name: Upload SLAT DAE artifact
        uses: actions/upload-artifact@v4
        with:
          name: anigen-slat-dae
          path: transfer/ckpts-slat-dae.tar
          compression-level: 0
          retention-days: 1

      - name: Upload SS Flow Solo part 00
        uses: actions/upload-artifact@v4
        with:
          name: anigen-ss-flow-solo-00
          path: transfer/ss-flow-solo.tar.part-00
          compression-level: 0
          retention-days: 1

      - name: Upload SS Flow Solo part 01
        uses: actions/upload-artifact@v4
        with:
          name: anigen-ss-flow-solo-01
          path: transfer/ss-flow-solo.tar.part-01
          compression-level: 0
          retention-days: 1

      - name: Upload SLAT Flow Auto part 00
        uses: actions/upload-artifact@v4
        with:
          name: anigen-slat-flow-auto-00
          path: transfer/slat-flow-auto.tar.part-00
          compression-level: 0
          retention-days: 1

      - name: Upload SLAT Flow Auto part 01
        uses: actions/upload-artifact@v4
        with:
          name: anigen-slat-flow-auto-01
          path: transfer/slat-flow-auto.tar.part-01
          compression-level: 0
          retention-days: 1
