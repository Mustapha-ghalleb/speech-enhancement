name: GoFile Probe

on:
  push:
    paths:
      - '.github/workflows/gofile-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Upload probe
        run: |
          printf 'AniGen bridge probe\n' > anigen-probe.txt
          echo '=== GOFILE_RESPONSE ==='
          curl --fail-with-body -X POST https://upload.gofile.io/uploadfile -F 'file=@anigen-probe.txt'
          echo
